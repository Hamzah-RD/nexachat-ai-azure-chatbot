<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hamzah RD AI Chatbot</title><link rel="stylesheet" href="/static/style.css"><script defer src="/static/chat.js"></script></head>
<body><main><header><div><span class="badge">AZURE · GPT-4.1 MINI</span><h1>Hamzah RD AI</h1><p>A little help, a conversation away.</p></div><button id="clear" type="button">＋ New chat</button></header>
<section id="chat" aria-label="Conversation" aria-live="polite"><div id="welcome"><span class="spark">✦</span><h2>What’s on your mind?</h2><p>Ask in English, Urdu or Roman Urdu.</p><div class="suggestions"><button type="button" data-prompt="Explain machine learning in simple Roman Urdu.">Explain machine learning</button><button type="button" data-prompt="Help me learn Python step by step.">Help me learn Python</button></div></div></section>
<p id="status" role="status"></p><form id="form"><label class="sr-only" for="input">Your message</label><textarea id="input" rows="2" maxlength="6000" placeholder="Type your message…" required></textarea><button id="send" type="submit">Send ↗</button></form><footer>AI can make mistakes. Check important answers. · Developed by Hamzah RD</footer></main></body></html>
